services:
  db:
    image: postgres:16
    # aucun "ports" : la base n'est joignable que depuis le réseau Docker
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data

  adminer:
    image: adminer
    ports:
      # Adminer écoute sur le port 8080 dans le conteneur
      - "${ADMINER_PORT}:8080"
    environment:
      # serveur proposé par défaut sur la page de connexion
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      - db

volumes:
  db-data:
